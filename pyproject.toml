[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thang3dvalidation"
version = "0.1.0"
description = "Reproducible CAD geometry and pretrained reconstruction evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["evaluation*", "vendor*"]
